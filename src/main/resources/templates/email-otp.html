<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Mã xác thực SpringTunes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { color-scheme: light dark; }
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            background-color: #f9f9f9;
            color: #111111;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .content {
            padding: 40px 32px;
            text-align: center;
        }
        .logo {
            font-size: 20px;
            font-weight: 600;
            color: #1DB954;
            text-decoration: none;
            margin-bottom: 32px;
            display: inline-block;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 16px 0;
            color: #1f1f1f;
        }
        .otp {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 6px;
            color: #1DB954;
            margin: 24px 0;
            padding: 12px 0;
        }
        p {
            color: #555555;
            font-size: 15px;
        }
        .footer {
            padding: 28px 32px;
            text-align: center;
            font-size: 13px;
            color: #777777;
            border-top: 1px solid #eeeeee;
        }

        @media (prefers-color-scheme: dark) {
            body { background-color: #0f0f0f; }
            .container { background: #1a1a1a; }
            h1, p { color: #ffffff; }
            .footer { border-top-color: #333333; color: #aaaaaa; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="content">
        <a href="#" class="logo">SpringTunes</a>

        <h1>Xin chào <span th:text="${name}">bạn</span>,</h1>
        <p>Mã xác thực của bạn là:</p>

        <div class="otp" th:text="${otp}">123456</div>

        <p style="margin-top: 8px;">
            Mã này sẽ hết hạn sau <strong>5 phút</strong>.
        </p>
        <p style="font-size: 14px; margin-top: 24px;">
            Vui lòng không chia sẻ mã này với bất kỳ ai.
        </p>
    </div>

    <div class="footer">
        © 2026 SpringTunes<br>
        Nếu bạn không yêu cầu mã này, vui lòng bỏ qua email.
    </div>
</div>
</body>
</html>
