<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { background-color: #ffffff; max-width: 600px; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 5px solid #1db954; }
        h2 { color: #121212; }
        .info-box { background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .info-item { margin-bottom: 10px; font-size: 15px; }
        .label { font-weight: bold; color: #555; }
        .content-box { background-color: #fff; border: 1px solid #eee; padding: 20px; border-radius: 5px; font-size: 15px; line-height: 1.6; color: #333; white-space: pre-wrap; }
        .footer { margin-top: 30px; font-size: 12px; color: #888; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h2>🚨 Yêu cầu hỗ trợ mới từ hệ thống</h2>
    <div class="info-box">
        <div class="info-item"><span class="label">Người gửi:</span> <span th:text="${userName}"></span></div>
        <div class="info-item"><span class="label">Email:</span> <span th:text="${userEmail}"></span></div>
        <div class="info-item"><span class="label">Phân loại:</span> <strong style="color: #1db954;" th:text="${requestType}"></strong></div>
    </div>
    <p class="label">Nội dung chi tiết:</p>
    <div class="content-box" th:text="${content}">Nội dung sẽ hiện ở đây...</div>
    <div class="footer">Đây là email tự động từ hệ thống SpringTunes.</div>
</div>
</body>
</html>
