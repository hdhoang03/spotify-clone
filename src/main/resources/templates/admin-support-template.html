<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu cầu hỗ trợ mới - SpringTunes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
        .container { max-width: 580px; margin: 0 auto; background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.07); }
        .header { background: #1DB954; color: white; padding: 24px 32px; font-weight: 600; }
        .content { padding: 32px; }
        .info { background: #f8f9fa; padding: 20px; border-radius: 12px; margin: 20px 0; }
        .label { font-weight: 600; color: #555; display: block; margin-bottom: 4px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .content-box { background: #fafafa; padding: 24px; border-radius: 12px; white-space: pre-wrap; line-height: 1.7; }
        .footer { padding: 24px 32px; text-align: center; font-size: 13px; color: #888; border-top: 1px solid #eee; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">🚨 Yêu cầu hỗ trợ mới</div>
    <div class="content">
        <div class="info">
            <div><span class="label">Người gửi</span> <span th:text="${userName}"></span></div>
            <div><span class="label">Email</span> <span th:text="${userEmail}"></span></div>
            <div><span class="label">Phân loại</span> <strong th:text="${requestType}"></strong></div>
        </div>

        <p class="label">Nội dung chi tiết</p>
        <div class="content-box" th:text="${content}"></div>
    </div>
    <div class="footer">
        Email tự động từ SpringTunes Admin System • 2026
    </div>
</div>
</body>
</html>
